name: Tests

on:
  push:
    branches:
      - master
      - production
      - 'projects/**'
  pull_request:
  # The drift alarms only fail on this run, so a vendor file going stale never
  # blocks an unrelated PR or a hotfix. Monday 08:00 UTC.
  schedule:
    - cron: '0 8 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The staleness guard in test/timezone-data.test.js compares the bundled
      # IANA data against the runner's own tzdata, so run the newest Node the
      # team supports: an older line carries older rules and would keep the
      # guard quiet after the vendor file has gone stale.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Only `dependencies` are needed to run the tests; the build toolchain in
      # `devDependencies` pins native modules that no longer install cleanly.
      - run: npm ci --omit=dev

      # TZ_DRIFT_CHECK gates the two staleness alarms in
      # test/timezone-data.test.js. They are a maintenance reminder, not a merge
      # gate: on a PR they skip, on the weekly run they fail.
      - run: npm test
        env:
          TZ_DRIFT_CHECK: ${{ github.event_name == 'schedule' }}
