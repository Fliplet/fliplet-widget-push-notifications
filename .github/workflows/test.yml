name: Tests

on:
  push:
    branches:
      - master
      - production
      - 'projects/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Only `dependencies` are needed to run the tests; the build toolchain in
      # `devDependencies` pins native modules that no longer install cleanly.
      - run: npm ci --omit=dev

      # The two drift alarms in test/timezone-data.test.js skip here. They run
      # weekly from timezone-drift.yml on master.
      - run: npm test
