name: Tests

on:
  push:
    branches:
      - master
      - production
      - 'projects/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The vendor guard in test/timezone-data.test.js compares the bundled
        # IANA data against the runner's own tzdata, which differs per Node
        # release line, so run the range the team actually develops on.
        node-version: ['18.x', '20.x', '22.x']

    name: test (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Only `dependencies` are needed to run the tests; the build toolchain in
      # `devDependencies` pins native modules that no longer install cleanly.
      - run: npm ci --omit=dev

      - run: npm test
